# Generated by `fly launch` — see README.md for the exact deploy steps.
# app name is set per-deploy target; replace before first `fly deploy` if
# `fly launch` didn't already rewrite this file.
app = "officepal-orchestrator"
primary_region = "arn" # Stockholm — closest Fly region to Nina's pilot; change if needed

[build]

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
