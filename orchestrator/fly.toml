# See DEPLOY.md for the exact deploy steps.
#
# app: placeholder name — `fly launch` will offer to rename this to whatever
# app name you pick (must be globally unique across all of Fly). Either
# accept its suggestion or edit this line to match before `fly deploy`.
app = "officepal-orchestrator"
primary_region = "arn" # Stockholm — closest Fly region to Nina's pilot; change if needed

[build]

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm for the pilot — autostopping to 0 adds a ~20s cold
  # start (machine boot + health check) on top of the agent's normal ~5-6s
  # processing time. See DEPLOY.md.
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
